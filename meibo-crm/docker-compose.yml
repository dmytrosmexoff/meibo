version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: meibo-crm_web_1
      APP_PORT: 80

  web:
    build:
      context: ${APP_DATA_DIR}/app
    restart: on-failure
    depends_on:
      - db
    environment:
      DB_HOST: meibo-crm_db_1
      DB_NAME: meibocrm
      DB_USER: meibocrm
      DB_PASS: ${APP_SEED}
      MEIBO_URL: http://UMBREL-IP:1475
      MEIBO_TOKEN: CHANGE-ME-READ-TOKEN

  db:
    image: mysql:8.4
    restart: on-failure
    environment:
      MYSQL_DATABASE: meibocrm
      MYSQL_USER: meibocrm
      MYSQL_PASSWORD: ${APP_SEED}
      MYSQL_ROOT_PASSWORD: ${APP_SEED}
    volumes:
      - ${APP_DATA_DIR}/data/mysql:/var/lib/mysql
