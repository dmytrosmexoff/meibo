version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: meibo-sheet_web_1
      APP_PORT: 80

  web:
    build: ./app
    restart: on-failure
    depends_on:
      - db
    environment:
      DB_HOST: meibo-sheet_db_1
      DB_NAME: meibo
      DB_USER: meibo
      DB_PASS: ${APP_SEED}

  db:
    image: mysql:8.4
    restart: on-failure
    environment:
      MYSQL_DATABASE: meibo
      MYSQL_USER: meibo
      MYSQL_PASSWORD: ${APP_SEED}
      MYSQL_ROOT_PASSWORD: ${APP_SEED}
    volumes:
      - ${APP_DATA_DIR}/data/mysql:/var/lib/mysql
