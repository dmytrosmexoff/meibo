<div id="stx" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9;overflow:auto"><div style="background:#fff;max-width:640px;margin:30px auto;padding:16px;border-radius:8px"><button id="stc" style="float:right">閉じる</button><div id="stb"></div></div></div>

<script>
const $=s=>document.querySelector(s),WDR=['вс','пн','вт','ср','чт','пт','сб'],WD='日月火水木金土',pad=n=>String(n).padStart(2,'0'),TW=367.1;
const MED=[['nextMorning','翌朝'],['morning','朝'],['patch','貼り薬'],['noon','昼'],['evening','夕'],['bedtime','寝る前']];
const U=[52,42,44,200,48,52,104,80,226,242,268,0,190,90,100,83,55,180,114];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DB={people:[],days:{},staff:[],counter:0,log:[]},online=true,open=new Set(),old='';
const n0=new Date();let date=n0.getFullYear()+'-'+pad(n0.getMonth()+1)+'-'+pad(n0.getDate());
const sp=e=>{e=String(e||'');const i=e.indexOf('\t');return i<0?['',e]:[e.slice(0,i),e.slice(i+1)]},stxt=e=>{const[a,b]=sp(e);return a?a+' '+b:b};
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const save=()=>schedule();
const log=(type,id,f,o,n)=>{DB.log.push({ts:new Date().toISOString(),type,id,f,o,n,date});if(DB.log.length>3000)DB.log.shift()};
const blank=()=>({present:[],overnight:[],staff:{dawn:[],day:[],night:[]},other:''});
const day=()=>DB.days[date]||blank();
const ensure=()=>{let d=DB.days[date];if(!d){d=DB.days[date]={...blank(),staff:{dawn:prevNight(date),day:[],night:[]},seq:0}}return d};
const setDay=(path,val,quiet)=>{const d=ensure(),[a,b]=path.split('.'),o=b?d[a][b]:d[a];if(b)d[a][b]=val;else d[a]=val;if(path==='staff.dawn')d.dawnManual=true;if(path==='staff.night'){const x=pd(date);x.setDate(x.getDate()+1);const nd=DB.days[dkey(x)];if(nd&&!nd.dawnManual)nd.staff.dawn=val.filter(Boolean)}if(!quiet&&JSON.stringify(o)!==JSON.stringify(val))log('day',date,path,o,val)};
const S=(p,dt=date)=>{let s=p.v[0].s;for(const v of p.v)if(v.from<=dt)s=v.s;return s};
const off=(p,dt=date)=>(p.off||[]).some(([a,b])=>dt>=a&&(b==null||dt<b)),vis=(p,dt=date)=>p.v[0].from<=dt&&!off(p,dt);
const mig=()=>{DB.staff=DB.staff||[];DB.people.forEach(p=>{if(p.del){(p.off=p.off||[]).push([p.del,null]);delete p.del}})};
const dv=s=>typeof s.delivery==='string'?{[s.delivery]:1}:(s.delivery||{});
const modeOf=(p,dd,dt)=>{if(!dd.present.includes(p.id))return null;const m=(dd.modes||{})[p.id];if(m)return m;return S(p,dt).kind==='visit'?'visit':(dd.overnight.includes(p.id)?'night':'day')};
const prevNight=dt=>{const y=pd(dt);y.setDate(y.getDate()-1);const pr=DB.days[dkey(y)];return pr?pr.staff.night.filter(Boolean):[]};
const curStaff=q=>(q==='dawn'&&!DB.days[date])?prevNight(date):day().staff[q];
const mealsOf=(p,m,dd,dt)=>{const s=S(p,dt);if(m==='visit'){const o=(dd.vmeals||{})[p.id];return o||(s.kind==='visit'?(s.meals||{}):{})}return s.meals||{}};
function setMode(p,mode,quiet){const d=ensure(),pr=new Set(d.present),ov=new Set(d.overnight),md={...(d.modes||{})};
 if(mode===null){pr.delete(p.id);ov.delete(p.id);delete md[p.id]}else{pr.add(p.id);md[p.id]=mode;if(mode==='night')ov.add(p.id);else ov.delete(p.id)}
 setDay('present',[...pr]);setDay('overnight',[...ov]);setDay('modes',md);if(!quiet)upd(1)}
const def=(name,kind)=>({name,kind,meds:{},note:'',vital:true,meals:kind==='visit'?{}:{b:1,l:1,d:1},delivery:{}});
const setS=(p,patch,quiet)=>{const cur=S(p),nw={...cur,...patch};if(!quiet)for(const k in patch)if(JSON.stringify(cur[k])!==JSON.stringify(patch[k]))log('person',p.id,k,cur[k],patch[k]);
 const v=p.v.find(x=>x.from===date);if(v)v.s=nw;else{p.v.push({from:date,s:nw});p.v.sort((a,b)=>a.from<b.from?-1:1)}};
const addP=(name,kind)=>{const p={id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),v:[{from:date,s:def(name,kind)}]};DB.people.push(p);log('person',p.id,'add',null,name);return p};
const pred=()=>{const wd=pd(date).getDay(),past=Object.keys(DB.days).filter(k=>k<date&&pd(k).getDay()===wd&&DB.days[k].present.length).sort().slice(-8),m={};
 DB.people.forEach(p=>{if(!vis(p))return;const ks=past.filter(k=>vis(p,k)),pr=ks.filter(k=>DB.days[k].present.includes(p.id));
  if(ks.length&&pr.length/ks.length>=.5){const c={day:0,night:0,visit:0};pr.forEach(k=>c[modeOf(p,DB.days[k],k)]++);const mode=Object.keys(c).sort((a,b)=>c[b]-c[a])[0];m[p.id]={n:pr.length,t:ks.length,mode}}});return m};
const dkey=x=>x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());
function fill(){const m=pred();Object.keys(m).forEach(k=>{const p=DB.people.find(x=>String(x.id)===k);if(p&&!day().present.includes(p.id))setMode(p,m[k].mode,true)});upd(1)}
let sm=null,armDel=null,hidOpen=false,printed=false,msg='';
const jd=()=>{const[y,m,d]=date.split('-').map(Number);return y+'年'+m+'月'+d+'日'};
const fname=()=>jd()+'_利用者名簿';
addEventListener('beforeprint',()=>{printed=true});addEventListener('afterprint',()=>{document.title='利用者名簿'});
function saveSheet(){const sh=$('#sheet'),css=document.querySelector('style').textContent;
 const html='<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><title>'+fname()+'</title><style>'+css+'body{margin:0;background:#fff}</style></head><body><div id="sheet" style="--r:'+sh.style.getPropertyValue('--r')+'">'+sh.innerHTML+'</div><script>onload=function(){setTimeout(function(){print()},300)}<\/script></body></html>';
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=fname()+'.html';a.click();
 msg='この画面では印刷できません。ファイル「'+fname()+'.html」をダウンロードしました。ダブルクリックで開くと印刷が始まります。ChromeまたはEdgeで直接開くことをおすすめします。';ui()}
function statsHTML(){
 const ym=sm||date.slice(0,7),by=id=>DB.people.find(x=>x.id===id),f1=x=>x.toFixed(1),wdn=k=>WDR[pd(k).getDay()];
 const one=k=>{const dd=DB.days[k]||blank();let r=0,o=0,v=0,m=[0,0,0],dl=0,md={};
  dd.present.forEach(id=>{const p=by(id);if(!p)return;const s=S(p,k),mo=modeOf(p,dd,k);if(mo==='visit')v++;else{r++;if(mo==='night')o++}const ml=mealsOf(p,mo,dd,k);['b','l','d'].forEach((x,j)=>{if(ml[x])m[j]++});dl+=['b','l','d'].filter(x=>dv(s)[x]).length;MED.forEach(q=>{if(s.meds[q[0]])md[q[0]]=(md[q[0]]||0)+1})});return{k,r,o,v,m,dl,md}};
 const calc=y=>Object.keys(DB.days).filter(k=>k.startsWith(y)&&DB.days[k].present.length).sort().map(one);
 const R=calc(ym),[yy,mm]=ym.split('-').map(Number),Q=calc(mm===1?(yy-1)+'-12':yy+'-'+pad(mm-1));
 const sm_=(a,f)=>a.reduce((s,x)=>s+f(x),0),T=x=>x.r+x.v,n=R.length,tp=sm_(R,T),tq=sm_(Q,T);
 const dlt=(a,b)=>b?((a>=b?'+':'')+((a-b)/b*100).toFixed(0)+'%'):'–';
 let h=`<input type="month" id="sm" value="${ym}">`;
 if(!n)return h+'<div class="mut" style="margin-top:6px">В этом месяце нет листов</div>';
 const mx=R.reduce((a,x)=>T(x)>T(a)?x:a),mn=R.reduce((a,x)=>T(x)<T(a)?x:a),c=one(date),sw=R.filter(x=>wdn(x.k)===wdn(date)),avg=(a,f)=>a.length?f1(sm_(a,f)/a.length):'–';
 const row=(a,b)=>`<tr><td>${a}</td><td>${b}</td></tr>`,tb=(hd,rows)=>`<table class="sx"><tr>${hd.map(x=>`<th>${x}</th>`).join('')}</tr>${rows}</table>`;
 h+='<table class="sx">'+row('Листов за месяц',n)+row('Всего посещений',`${tp} (${dlt(tp,tq)} к прошлому месяцу)`)+row('В среднем в день',f1(tp/n))
  +row('Больше всего',`${mx.k.slice(5)} (${wdn(mx.k)}): ${T(mx)}`)+row('Меньше всего',`${mn.k.slice(5)} (${wdn(mn.k)}): ${T(mn)}`)
  +row('Ночёвок всего / в среднем',`${sm_(R,x=>x.o)} / ${avg(R,x=>x.o)}`)+row('Выездов всего / в среднем',`${sm_(R,x=>x.v)} / ${avg(R,x=>x.v)}`)
  +row('Завтраки / обеды / ужины (всего)',[0,1,2].map(j=>sm_(R,x=>x.m[j])).join(' / '))+row('Доставка 配 (всего)',sm_(R,x=>x.dl))
  +row('Людей с заметкой 注意点',DB.people.filter(p=>vis(p)&&S(p).note.trim()).length)+'</table>';
 h+=`<div class="mut">Выбранный день (${wdn(date)}): приходят ${c.r}, ночуют ${c.o}, выезд ${c.v} · в среднем по таким дням: ${avg(sw,x=>x.r)} / ${avg(sw,x=>x.o)} / ${avg(sw,x=>x.v)}</div>`;
 h+='<h4>По дням недели</h4>'+tb(['','листов','приходят','ночуют','выезд'],[0,1,2,3,4,5,6].map(i=>{const a=R.filter(x=>pd(x.k).getDay()===i);return `<tr><td>${WDR[i]}</td><td>${a.length}</td><td>${avg(a,x=>x.r)}</td><td>${avg(a,x=>x.o)}</td><td>${avg(a,x=>x.v)}</td></tr>`}).join(''));
 h+='<h4>Лекарства</h4>'+tb(['','человеко-дней','в день'],MED.map(q=>`<tr><td>${q[1]}</td><td>${sm_(R,x=>x.md[q[0]]||0)}</td><td>${avg(R,x=>x.md[q[0]]||0)}</td></tr>`).join(''));
 const pc={};R.forEach(x=>DB.days[x.k].present.forEach(id=>{const q=pc[id]=pc[id]||{d:0,o:0,l:''};q.d++;if(DB.days[x.k].overnight.includes(id))q.o++;q.l=x.k}));
 const pl=Object.keys(pc).map(id=>[by(+id)||by(id),pc[id]]).filter(x=>x[0]).sort((a,b)=>b[1].d-a[1].d);
 h+='<h4>По людям</h4>'+tb(['Человек','дней','ночей','% листов','последний'],pl.map(([p,q])=>`<tr><td>${esc(S(p,date).name)}</td><td>${q.d}</td><td>${q.o}</td><td>${(q.d/n*100).toFixed(0)}%</td><td>${q.l.slice(5)}</td></tr>`).join(''));
