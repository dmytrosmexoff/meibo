<script>
const $=s=>document.querySelector(s),WD='日月火水木金土',pad=n=>String(n).padStart(2,'0'),TW=367.1;
const MED=[['nextMorning','翌朝'],['morning','朝'],['patch','貼り薬'],['noon','昼'],['evening','夕'],['bedtime','寝る前']];
const U=[52,42,44,200,48,52,104,80,226,292,268,0,140,104,66,83,55,180,114];

let DB={people:[],days:{},staff:[],counter:0,log:[]},online=true,open=new Set(),old='';
const n0=new Date();let date=n0.getFullYear()+'-'+pad(n0.getMonth()+1)+'-'+pad(n0.getDate());
const sp=e=>{e=String(e||'');const i=e.indexOf('\t');return i<0?['',e]:[e.slice(0,i),e.slice(i+1)]},stxt=e=>{const[a,b]=sp(e);return a?a+' '+b:b};
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const save=()=>schedule();
const log=(type,id,f,o,n)=>{DB.log.push({ts:new Date().toISOString(),type,id,f,o,n,date});if(DB.log.length>3000)DB.log.shift()};
const blank=()=>({present:[],overnight:[],staff:{dawn:[],day:[],night:[]},other:''});
const day=()=>DB.days[date]||blank();
const ensure=()=>{let d=DB.days[date];if(!d){d=DB.days[date]={...blank(),seq:0}}return d};
const setDay=(path,val,quiet)=>{const d=ensure(),[a,b]=path.split('.'),o=b?d[a][b]:d[a];if(b)d[a][b]=val;else d[a]=val;if(!quiet&&JSON.stringify(o)!==JSON.stringify(val))log('day',date,path,o,val)};
const S=(p,dt=date)=>{let s=p.v[0].s;for(const v of p.v)if(v.from<=dt)s=v.s;return s};
const off=(p,dt=date)=>(p.off||[]).some(([a,b])=>dt>=a&&(b==null||dt<b)),vis=(p,dt=date)=>p.v[0].from<=dt&&!off(p,dt);
const mig=()=>{DB.staff=DB.staff||[];DB.people.forEach(p=>{if(p.del){(p.off=p.off||[]).push([p.del,null]);delete p.del}})};
const dv=s=>typeof s.delivery==='string'?{[s.delivery]:1}:(s.delivery||{});
const def=(name,kind)=>({name,kind,meds:{},note:'',vital:true,meals:kind==='visit'?{}:{b:1,l:1,d:1},delivery:{}});
const setS=(p,patch,quiet)=>{const cur=S(p),nw={...cur,...patch};if(!quiet)for(const k in patch)if(JSON.stringify(cur[k])!==JSON.stringify(patch[k]))log('person',p.id,k,cur[k],patch[k]);
 const v=p.v.find(x=>x.from===date);if(v)v.s=nw;else{p.v.push({from:date,s:nw});p.v.sort((a,b)=>a.from<b.from?-1:1)}};
const addP=(name,kind)=>{const p={id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),v:[{from:date,s:def(name,kind)}]};DB.people.push(p);log('person',p.id,'add',null,name);return p};
const pred=()=>{const wd=pd(date).getDay(),past=Object.keys(DB.days).filter(k=>k<date&&pd(k).getDay()===wd&&DB.days[k].present.length).sort().slice(-8),m={};
 DB.people.forEach(p=>{if(!vis(p))return;const ks=past.filter(k=>vis(p,k)),n=ks.filter(k=>DB.days[k].present.includes(p.id)).length,o=ks.filter(k=>DB.days[k].overnight.includes(p.id)).length;if(ks.length&&n/ks.length>=.5)m[p.id]={n,t:ks.length,ov:n>0&&o/n>=.5}});return m};
function fill(){const m=pred(),s=new Set(day().present),o=new Set(day().overnight);Object.keys(m).forEach(k=>{const p=DB.people.find(x=>String(x.id)===k);if(!p)return;s.add(p.id);if(m[k].ov&&S(p).kind==='regular')o.add(p.id)});setDay('present',[...s]);setDay('overnight',[...o]);upd(1)}
let sm=null,armDel=null,hidOpen=false,printed=false,msg='';
const jd=()=>{const[y,m,d]=date.split('-').map(Number);return y+'年'+m+'月'+d+'日'};
const fname=()=>jd()+'_利用者名簿';
addEventListener('beforeprint',()=>{printed=true});addEventListener('afterprint',()=>{document.title='利用者名簿'});
function saveSheet(){const sh=$('#sheet'),css=document.querySelector('style').textContent;
 const html='<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><title>'+fname()+'</title><style>'+css+'body{margin:0;background:#fff}</style></head><body><div id="sheet" style="--r:'+sh.style.getPropertyValue('--r')+'">'+sh.innerHTML+'</div><script>onload=function(){setTimeout(function(){print()},300)}<\/script></body></html>';
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=fname()+'.html';a.click();
 msg='この画面では印刷できません。ファイル「'+fname()+'.html」をダウンロードしました。ダブルクリックで開くと印刷が始まります。ChromeまたはEdgeで直接開くことをおすすめします。';ui()}
function statsHTML(){
 const ym=sm||date.slice(0,7),by=id=>DB.people.find(x=>x.id===id),f1=x=>x.toFixed(1),wdn=k=>WD[pd(k).getDay()];
 const one=k=>{const dd=DB.days[k]||blank();let r=0,o=0,v=0,m=[0,0,0],dl=0,md={};
  dd.present.forEach(id=>{const p=by(id);if(!p)return;const s=S(p,k);if(s.kind==='visit')v++;else{r++;if(dd.overnight.includes(id))o++}['b','l','d'].forEach((x,j)=>{if(s.meals[x])m[j]++});dl+=['b','l','d'].filter(x=>dv(s)[x]).length;MED.forEach(q=>{if(s.meds[q[0]])md[q[0]]=(md[q[0]]||0)+1})});return{k,r,o,v,m,dl,md}};
 const calc=y=>Object.keys(DB.days).filter(k=>k.startsWith(y)&&DB.days[k].present.length).sort().map(one);
 const R=calc(ym),[yy,mm]=ym.split('-').map(Number),Q=calc(mm===1?(yy-1)+'-12':yy+'-'+pad(mm-1));
 const sm_=(a,f)=>a.reduce((s,x)=>s+f(x),0),T=x=>x.r+x.v,n=R.length,tp=sm_(R,T),tq=sm_(Q,T);
 const dlt=(a,b)=>b?((a>=b?'+':'')+((a-b)/b*100).toFixed(0)+'%'):'–';
 let h=`<input type="month" id="sm" value="${ym}">`;
 if(!n)return h+'<div class="mut" style="margin-top:6px">この月のシートはありません</div>';
 const mx=R.reduce((a,x)=>T(x)>T(a)?x:a),mn=R.reduce((a,x)=>T(x)<T(a)?x:a),c=one(date),sw=R.filter(x=>wdn(x.k)===wdn(date)),avg=(a,f)=>a.length?f1(sm_(a,f)/a.length):'–';
 const row=(a,b)=>`<tr><td>${a}</td><td>${b}</td></tr>`,tb=(hd,rows)=>`<table class="sx"><tr>${hd.map(x=>`<th>${x}</th>`).join('')}</tr>${rows}</table>`;
 h+='<table class="sx">'+row('月のシート数',n)+row('延べ利用数',`${tp}（前月比 ${dlt(tp,tq)}）`)+row('1日あたり平均',f1(tp/n))
  +row('最多',`${mx.k.slice(5)} (${wdn(mx.k)}): ${T(mx)}`)+row('最少',`${mn.k.slice(5)} (${wdn(mn.k)}): ${T(mn)}`)
  +row('宿泊 合計 / 平均',`${sm_(R,x=>x.o)} / ${avg(R,x=>x.o)}`)+row('訪問 合計 / 平均',`${sm_(R,x=>x.v)} / ${avg(R,x=>x.v)}`)
  +row('朝食 / 昼食 / 夕食（合計）',[0,1,2].map(j=>sm_(R,x=>x.m[j])).join(' / '))+row('配食（合計）',sm_(R,x=>x.dl))
  +row('注意点のある人数',DB.people.filter(p=>vis(p)&&S(p).note.trim()).length)+'</table>';
 h+=`<div class="mut">選択日（${wdn(date)}）：通い ${c.r}、泊まり ${c.o}、訪問 ${c.v}　同じ曜日の平均：${avg(sw,x=>x.r)} / ${avg(sw,x=>x.o)} / ${avg(sw,x=>x.v)}</div>`;
 h+='<h4>曜日別</h4>'+tb(['','シート数','通い','泊まり','訪問'],[0,1,2,3,4,5,6].map(i=>{const a=R.filter(x=>pd(x.k).getDay()===i);return `<tr><td>${WD[i]}</td><td>${a.length}</td><td>${avg(a,x=>x.r)}</td><td>${avg(a,x=>x.o)}</td><td>${avg(a,x=>x.v)}</td></tr>`}).join(''));
 h+='<h4>服薬</h4>'+tb(['','延べ人数','1日平均'],MED.map(q=>`<tr><td>${q[1]}</td><td>${sm_(R,x=>x.md[q[0]]||0)}</td><td>${avg(R,x=>x.md[q[0]]||0)}</td></tr>`).join(''));
 const pc={};R.forEach(x=>DB.days[x.k].present.forEach(id=>{const q=pc[id]=pc[id]||{d:0,o:0,l:''};q.d++;if(DB.days[x.k].overnight.includes(id))q.o++;q.l=x.k}));
 const pl=Object.keys(pc).map(id=>[by(+id)||by(id),pc[id]]).filter(x=>x[0]).sort((a,b)=>b[1].d-a[1].d);
 h+='<h4>利用者別</h4>'+tb(['利用者','日数','泊数','出現率','最終日'],pl.map(([p,q])=>`<tr><td>${esc(S(p,date).name)}</td><td>${q.d}</td><td>${q.o}</td><td>${(q.d/n*100).toFixed(0)}%</td><td>${q.l.slice(5)}</td></tr>`).join(''));
 const miss=DB.people.filter(p=>vis(p)&&!pc[p.id]);if(miss.length)h+=`<div class="mut">この月の利用なし：${miss.map(p=>esc(S(p).name)).join(', ')}</div>`;
 const mt=Math.max(...R.map(T),1);
 h+='<h4>日別</h4>'+R.map(x=>`<div class="bar"><span>${x.k.slice(5)} ${wdn(x.k)}</span><i style="width:${T(x)/mt*60}%"></i><b>${x.r}/${x.o}/${x.v}</b></div>`).join('')+'<div class="mut">通い / 泊まり / 訪問</div>';
 const sc={};R.forEach(x=>{const st=DB.days[x.k].staff;['dawn','day','night'].forEach((q,i)=>st[q].forEach(nm=>{nm=sp(nm||'')[1].trim();if(nm)(sc[nm]=sc[nm]||[0,0,0])[i]++}))});
 const sk=Object.keys(sc).sort((a,b)=>sm_(sc[b],x=>x)-sm_(sc[a],x=>x));
 if(sk.length)h+='<h4>職員（月の勤務回数）</h4>'+tb(['','明','日勤','夜勤','合計'],sk.map(nm=>`<tr><td>${esc(nm)}</td><td>${sc[nm][0]}</td><td>${sc[nm][1]}</td><td>${sc[nm][2]}</td><td>${sm_(sc[nm],x=>x)}</td></tr>`).join(''));
 return h}
/* ---- server sync (MySQL through api.php) ---- */
let snap={},busy=false,dirty=false,pend=false,timer=0;
const jp=(a,b)=>fetch('api.php?a='+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>{if(!r.ok)throw 0;return r.json()});
const ser=o=>{const c={...o};delete c.rev;return JSON.stringify(c)};
function adopt(r){DB.people=r.people.map(x=>{const o=JSON.parse(x.data);o.id=x.id;o.rev=x.rev;return o});DB.staff=r.staff;DB.counter=r.counter;DB.days={};
 r.days.forEach(x=>{const o=JSON.parse(x.data);o.seq=x.seq;o.rev=x.rev;DB.days[x.d]=o});
 snap={};DB.people.forEach(p=>snap['p'+p.id]=ser(p));Object.keys(DB.days).forEach(k=>snap['d'+k]=ser(DB.days[k]));snap.staff=JSON.stringify(DB.staff)}
async function reload(){try{const r=await fetch('api.php?a=load').then(r=>{if(!r.ok)throw 0;return r.json()});adopt(r);online=true}catch(e){online=false}ui();render()}
const schedule=()=>{pend=true;clearTimeout(timer);timer=setTimeout(flush,400)};
const unsynced=()=>DB.people.some(p=>snap['p'+p.id]!==ser(p))||Object.keys(DB.days).some(k=>snap['d'+k]!==ser(DB.days[k]))||snap.staff!==JSON.stringify(DB.staff)||Object.keys(snap).some(k=>k[0]==='p'&&!DB.people.some(p=>'p'+p.id===k));
async function flush(){pend=false;if(busy){dirty=true;return}busy=true;
 try{
  for(const p of DB.people){const s=ser(p);if(snap['p'+p.id]!==s){const r=await jp('save_person',{id:p.id,rev:p.rev||0,data:s});if(r.conflict){await conflict();return}p.rev=r.rev;snap['p'+p.id]=ser(p)}}
  for(const k of Object.keys(snap)){if(k[0]==='p'&&!DB.people.some(p=>'p'+p.id===k)){await jp('delete_person',{id:k.slice(1)});delete snap[k]}}
  const sj=JSON.stringify(DB.staff);if(snap.staff!==sj){await jp('save_staff',{names:DB.staff});snap.staff=sj}
  for(const k of Object.keys(DB.days)){const d=DB.days[k],s=ser(d);if(snap['d'+k]!==s){const r=await jp('save_day',{d:k,rev:d.rev||0,data:s});if(r.conflict){await conflict();return}d.rev=r.rev;d.seq=r.seq;snap['d'+k]=ser(d);if(k===date)render()}}
  if(DB.log.length){const e=DB.log.splice(0);try{await jp('log',{entries:e})}catch(x){DB.log.unshift(...e);throw x}}
  if(!online){online=true;ui()}
 }catch(e){if(online){online=false;ui()}}

async function conflict(){msg='他の端末で更新されました。最新の状態を読み込みました。';await reload()}
function poll(){if(busy||dirty||pend)return;const np=document.querySelector('[data-new="1"]');if(np&&np.value)return;if(unsynced()){flush();return}const a=document.activeElement;if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))return;reload()}
async function doPrint(){ensure();clearTimeout(timer);await flush();if(busy)await new Promise(r=>setTimeout(r,800));render();msg='';ui();printed=false;document.title=fname();try{window.print()}catch(e){}setTimeout(()=>{if(!printed)saveSheet();document.title='利用者名簿'},1200)}
function render(){
 const d=day(),P=DB.people.filter(p=>vis(p)),on=p=>d.present.includes(p.id),ov=p=>d.overnight.includes(p.id);

 const N=reg.length+vs.length+6,r=Math.max(5.5,Math.min(7.76,230.8/N)),f=(TW-r)/2150,W=U.map(u=>u?u*f:r);
 const X=[0];W.forEach(w=>X.push(X[X.length-1]+w));
 const cnt=[0,0,0];[...reg,...vs].forEach(p=>['b','l','d'].forEach((k,j)=>{if(S(p).meals[k])cnt[j]++}));
